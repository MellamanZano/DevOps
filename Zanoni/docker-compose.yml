name: data-stack

x-hdfs-env: &hdfs-env
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  CORE-SITE.XML_fs.default.name: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  HDFS-SITE.XML_dfs.replication: "1"
  HDFS-SITE.XML_dfs.permissions.enabled: "false"
  HDFS-SITE.XML_dfs.namenode.name.dir: /hadoop/dfs/name
  HDFS-SITE.XML_dfs.datanode.data.dir: /hadoop/dfs/data
  YARN-SITE.XML_yarn.resourcemanager.hostname: resourcemanager

# NOTA: los servicios SIN "profiles" (HDFS + YARN) arrancan con `docker compose up -d`.
# Los servicios con profile "extra" (Spark, Kafka, Mongo, Postgres, Jupyter)
# solo arrancan con: docker compose --profile extra up -d

services:
  # ---------------- HDFS ----------------
  namenode:
    image: apache/hadoop:3.4.0
    container_name: namenode
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # UI web HDFS
      - "8020:8020"   # RPC
    environment:
      <<: *hdfs-env
      # Subdirectorio que no existe en el primer arranque -> fuerza el formateo
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name/current
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ../datos:/workspace         # CSV compartido con el host
    networks: [datanet]

  datanode:
    image: apache/hadoop:3.4.0
    container_name: datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    ports:
      - "9864:9864"   # UI datanode
    environment:
      <<: *hdfs-env
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks: [datanet]

  # ---------------- YARN ----------------
  resourcemanager:
    image: apache/hadoop:3.4.0
    container_name: resourcemanager
    hostname: resourcemanager
    user: root
    command: ["yarn", "resourcemanager"]
    depends_on: [namenode]
    ports:
      - "8088:8088"   # UI web de YARN
    environment:
      <<: *hdfs-env
    networks: [datanet]

  nodemanager:
    image: apache/hadoop:3.4.0
    container_name: nodemanager
    hostname: nodemanager
    user: root
    command: ["yarn", "nodemanager"]
    depends_on: [resourcemanager]
    ports:
      - "8042:8042"   # UI web NodeManager
    environment:
      <<: *hdfs-env
    networks: [datanet]

  # ---------------- SPARK (extra) ----------------
  spark-master:
    profiles: ["extra"]
    image: bitnamilegacy/spark:3.5
    container_name: spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8090:8080"
      - "7077:7077"
    networks: [datanet]

  spark-worker:
    profiles: ["extra"]
    image: bitnamilegacy/spark:3.5
    container_name: spark-worker
    depends_on: [spark-master]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8081:8081"
    networks: [datanet]

  # ---------------- KAFKA (extra) ----------------
  kafka:
    profiles: ["extra"]
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [datanet]

  # ---------------- MONGODB (extra) ----------------
  mongodb:
    profiles: ["extra"]
    image: mongo:7.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: [datanet]

  # ---------------- POSTGRES (extra) ----------------
  postgres:
    profiles: ["extra"]
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: sqoopuser
      POSTGRES_PASSWORD: sqooppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [datanet]

  # ---------------- JUPYTER (extra) ----------------
  jupyter:
    profiles: ["extra"]
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: jupyter
    hostname: jupyter
    depends_on: [spark-master]
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      SPARK_MASTER: spark://spark-master:7077
    volumes:
      - ./notebooks:/workspace
    networks: [datanet]

networks:
  datanet:
    driver: bridge

volumes:
  namenode_data:
  datanode_data:
  kafka_data:
  mongo_data:
  postgres_data:
